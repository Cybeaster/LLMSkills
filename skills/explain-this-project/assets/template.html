<!DOCTYPE html>
<!--
  TEMPLATE — copy this file, fill in the marked places, delete these comments.

  Rules that matter:
    * One file. No CDN, no fonts from the network, no external scripts.
      It has to open from a USB stick on a plane.
    * Fill lang="ru" or lang="en" to match the output language.
    * Every technical term, on FIRST mention only:
          <span class="t" data-def="Определение без жаргона, до 220 символов.">шлюз (API Gateway)</span>
      The tooltip opens on hover (desktop) and on tap (touch). Esc closes it.
    * Keep the six sections and their order. Delete a component you don't use;
      don't invent new ones.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!-- Проект — разбор для новичка --></title>
<style>
  :root{
    --paper:#faf8f4; --ink:#1b1a17; --muted:#6d6862; --rule:#e3ded5;
    --accent:#0f6d63; --accent-soft:#e6f0ee; --warn:#a4560c; --warn-soft:#fbf0e2;
    --card:#fffdfa;
    --sans:ui-sans-serif,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --serif:ui-serif,Georgia,"Times New Roman",serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--serif);
       font-size:18px;line-height:1.65;-webkit-text-size-adjust:100%}
  .wrap{max-width:44rem;margin:0 auto;padding:3.5rem 1.25rem 6rem}
  h1{font-family:var(--sans);font-size:2rem;line-height:1.2;margin:0 0 .4rem;letter-spacing:-.02em}
  .sub{font-family:var(--sans);color:var(--muted);font-size:.95rem;margin:0 0 2.5rem}
  h2{font-family:var(--sans);font-size:1.3rem;line-height:1.3;margin:0;letter-spacing:-.01em}
  h3{font-family:var(--sans);font-size:1rem;margin:0 0 .35rem}
  p{margin:0 0 1rem}
  code,.path{font-family:var(--mono);font-size:.85em;background:#f1ede5;
             border:1px solid var(--rule);border-radius:4px;padding:.08em .35em}

  /* ---- section header: big muted number + title ---- */
  section{margin:0 0 3.25rem;scroll-margin-top:1rem}
  .head{display:flex;gap:.9rem;align-items:baseline;
        border-top:2px solid var(--ink);padding-top:.7rem;margin-bottom:1.1rem}
  .num{font-family:var(--sans);font-weight:700;font-size:.85rem;color:var(--accent);
       letter-spacing:.08em;flex:none;padding-top:.15rem}

  /* ---- TERM + TOOLTIP ---- */
  .t{border-bottom:2px dotted var(--accent);cursor:help;color:inherit;
     text-decoration:none;background:none;font:inherit;padding:0}
  .t:hover,.t:focus{background:var(--accent-soft);outline:none}
  #pop{position:absolute;z-index:50;max-width:20rem;background:var(--ink);color:#fdfcfa;
       font-family:var(--sans);font-size:.83rem;line-height:1.5;padding:.6rem .75rem;
       border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.22);display:none}
  #pop.on{display:block}

  /* ---- MAP OF PARTS (section 2) ----
       One .layer per tier. Repeat .node inside .nodes. Put .arrow between layers.
       If a part is external (managed DB, third-party API), add class "ext". ---- */
  .map{background:var(--card);border:1px solid var(--rule);border-radius:10px;
       padding:1.1rem;margin:0 0 1.4rem}
  .layer{margin:0 0 .2rem}
  .layer-label{font-family:var(--sans);font-size:.68rem;text-transform:uppercase;
               letter-spacing:.1em;color:var(--muted);margin-bottom:.35rem}
  .nodes{display:flex;flex-wrap:wrap;gap:.5rem}
  .node{flex:1 1 8rem;background:var(--accent-soft);border:1px solid #c7ded9;
        border-radius:7px;padding:.5rem .65rem;font-family:var(--sans);font-size:.82rem;
        line-height:1.35}
  .node b{display:block;font-size:.88rem}
  .node span{color:var(--muted)}
  .node.ext{background:#f2efe9;border-color:var(--rule)}
  .arrow{text-align:center;color:var(--muted);font-size:.9rem;margin:.15rem 0 .35rem}

  /* ---- FLOW (section 3): numbered end-to-end trace ---- */
  ol.flow{list-style:none;counter-reset:s;padding:0;margin:0}
  ol.flow li{counter-increment:s;position:relative;padding:0 0 1rem 2.4rem;
             border-left:2px solid var(--rule);margin-left:.7rem}
  ol.flow li:last-child{border-left-color:transparent}
  ol.flow li::before{content:counter(s);position:absolute;left:-.85rem;top:0;
    width:1.7rem;height:1.7rem;border-radius:50%;background:var(--accent);color:#fff;
    font-family:var(--sans);font-size:.8rem;font-weight:700;display:grid;place-items:center}
  ol.flow p{margin:0 0 .3rem}

  /* ---- PRINCIPLE CARD (section 4): four beats ---- */
  .principle{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--accent);
             border-radius:8px;padding:.9rem 1.1rem;margin:0 0 .9rem}
  .beat{display:grid;grid-template-columns:7.5rem 1fr;gap:.5rem;margin:.45rem 0}
  .beat dt{font-family:var(--sans);font-size:.72rem;text-transform:uppercase;
           letter-spacing:.06em;color:var(--muted);padding-top:.28rem}
  .beat dd{margin:0;font-size:.95rem}
  .beat.cost dt{color:var(--warn)}

  /* ---- RISKS (section 5) ---- */
  .risk{background:var(--warn-soft);border:1px solid #eddcc4;border-radius:8px;
        padding:.75rem 1rem;margin:0 0 .7rem;font-size:.95rem}
  .risk b{font-family:var(--sans)}

  /* ---- LEARNING PATH (section 6) ---- */
  .group-label{font-family:var(--sans);font-size:.75rem;text-transform:uppercase;
               letter-spacing:.09em;color:var(--muted);margin:1.4rem 0 .6rem}
  ol.learn{list-style:none;counter-reset:l;padding:0;margin:0}
  ol.learn li{counter-increment:l;display:grid;grid-template-columns:2rem 1fr;
              gap:.7rem;padding:.55rem 0;border-bottom:1px solid var(--rule)}
  ol.learn li::before{content:counter(l);font-family:var(--sans);font-weight:700;
                      color:var(--accent);font-size:.95rem;padding-top:.15rem}
  ol.learn .why{display:block;color:var(--muted);font-size:.88rem}

  /* ---- gaps we couldn't resolve ---- */
  .unknown{border-left:3px solid var(--muted);padding-left:.8rem;color:var(--muted);
           font-size:.92rem;margin:1rem 0}

  /* ---- collapsed term index, for Ctrl+F ---- */
  details.gloss{margin-top:3rem;border-top:1px solid var(--rule);padding-top:1rem}
  details.gloss summary{font-family:var(--sans);font-size:.9rem;cursor:pointer;color:var(--muted)}
  details.gloss dl{font-size:.9rem;margin-top:.8rem}
  details.gloss dt{font-family:var(--sans);font-weight:600;margin-top:.7rem}
  details.gloss dd{margin:.1rem 0 0}

  @media (max-width:560px){
    body{font-size:17px}
    .wrap{padding:2.25rem 1rem 4rem}
    h1{font-size:1.6rem}
    .beat{grid-template-columns:1fr;gap:.1rem}
    .beat dt{padding-top:.3rem}
  }
  @media print{
    body{background:#fff;font-size:11pt}
    .t{border-bottom:1px solid #999}
    .t::after{content:" (" attr(data-def) ")";font-size:.8em;color:#555}
    #pop{display:none!important}
    details.gloss[open],details.gloss{display:none}
    section{break-inside:avoid}
  }
</style>
</head>
<body>
<div class="wrap">

  <h1><!-- Название проекта --></h1>
  <p class="sub"><!-- Разбор для тех, кто впервые открыл этот репозиторий · дата · коммит --></p>

  <section>
    <div class="head"><span class="num">01</span><h2>Что это за проект</h2></div>
    <!-- 120–180 слов. Ни одного технического термина. Что делает, кто пользуется,
         какую проблему решает, чем НЕ является. -->
  </section>

  <section>
    <div class="head"><span class="num">02</span><h2>Из чего он состоит</h2></div>
    <div class="map">
      <div class="layer">
        <div class="layer-label"><!-- Кто обращается --></div>
        <div class="nodes">
          <div class="node"><b><!-- Браузер --></b><span><!-- что делает --></span></div>
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="layer">
        <div class="layer-label"><!-- Приложение --></div>
        <div class="nodes">
          <div class="node"><b><!-- api-gateway --></b><span><!-- зачем существует отдельно --></span></div>
          <div class="node"><b><!-- orders-service --></b><span><!-- ... --></span></div>
        </div>
      </div>
      <div class="arrow">↓</div>
      <div class="layer">
        <div class="layer-label"><!-- Хранилища и внешние сервисы --></div>
        <div class="nodes">
          <div class="node ext"><b><!-- PostgreSQL --></b><span><!-- ... --></span></div>
        </div>
      </div>
    </div>
    <!-- 200–300 слов: по одной фразе на каждую коробку — что делает и почему живёт отдельно. -->
  </section>

  <section>
    <div class="head"><span class="num">03</span><h2>Как проходит один запрос</h2></div>
    <p><!-- Одна фраза: какое действие прослеживаем. --></p>
    <ol class="flow">
      <li><p><!-- шаг --></p><p><code class="path"><!-- реальный путь к файлу --></code></p></li>
    </ol>
  </section>

  <section>
    <div class="head"><span class="num">04</span><h2>Почему построено именно так</h2></div>
    <div class="principle">
      <h3><!-- Принцип (English name) --></h3>
      <dl>
        <div class="beat"><dt>Что это</dt><dd><!-- бытовая аналогия --></dd></div>
        <div class="beat"><dt>Зачем</dt><dd><!-- какую боль снимает --></dd></div>
        <div class="beat"><dt>Где здесь</dt><dd><code class="path"><!-- путь --></code></dd></div>
        <div class="beat cost"><dt>Чем платим</dt><dd><!-- цена, всегда есть --></dd></div>
      </dl>
    </div>
  </section>

  <section>
    <div class="head"><span class="num">05</span><h2>Что здесь может пойти не так</h2></div>
    <div class="risk"><b><!-- Сбой --></b> — <!-- что происходит и как проект защищается --></div>
  </section>

  <section>
    <div class="head"><span class="num">06</span><h2>Что нужно выучить, чтобы собрать похожее</h2></div>
    <div class="group-label"><!-- Без этого не обойтись --></div>
    <ol class="learn">
      <li><div><!-- тема --><span class="why"><!-- почему именно на этом месте; где увидеть в проекте --></span></div></li>
    </ol>
    <div class="group-label"><!-- Что этот проект добавляет сверху --></div>
    <ol class="learn">
      <li><div><!-- тема --><span class="why"><!-- ... --></span></div></li>
    </ol>
  </section>

  <!-- Опционально, если что-то осталось непонятным:
  <p class="unknown">Не удалось определить: …</p> -->

  <details class="gloss">
    <summary>Все термины одним списком</summary>
    <dl>
      <dt><!-- термин --></dt><dd><!-- то же определение, что в подсказке --></dd>
    </dl>
  </details>

</div>

<div id="pop" role="tooltip"></div>
<script>
(function(){
  var pop=document.getElementById('pop'),cur=null;
  function show(el){
    cur=el; pop.textContent=el.getAttribute('data-def'); pop.classList.add('on');
    var r=el.getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
    var left=r.left+window.scrollX+r.width/2-pw/2;
    left=Math.max(8,Math.min(left,document.documentElement.clientWidth-pw-8));
    var top=r.top+window.scrollY-ph-8;
    if(top<window.scrollY+4) top=r.bottom+window.scrollY+8;
    pop.style.left=left+'px'; pop.style.top=top+'px';
  }
  function hide(){pop.classList.remove('on');cur=null;}
  document.querySelectorAll('.t').forEach(function(el){
    el.setAttribute('tabindex','0');
    el.addEventListener('mouseenter',function(){show(el)});
    el.addEventListener('mouseleave',hide);
    el.addEventListener('focus',function(){show(el)});
    el.addEventListener('blur',hide);
    el.addEventListener('click',function(e){e.stopPropagation();cur===el?hide():show(el)});
    el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();cur===el?hide():show(el)}});
  });
  document.addEventListener('click',hide);
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hide()});
  window.addEventListener('resize',hide);
})();
</script>
</body>
</html>
